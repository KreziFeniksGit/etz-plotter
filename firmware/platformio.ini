; ETZ plotter firmware - ESP32-S3-DevKitC-1 N16R8
; Open THIS folder (firmware/) in VS Code with the PlatformIO extension.
; Upload / monitor through the USB port marked "UART" on the board (Serial = UART0, 115200).

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi      ; N16R8: 16 MB QIO flash, 8 MB octal PSRAM
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
monitor_speed = 115200
; keys go straight to the ESP32; the firmware echoes them and handles Backspace (no send_on_enter / monitor_echo)
monitor_filters = direct
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0               ; Serial = the UART USB port
lib_deps =
    teemuatlut/TMCStepper@^0.7.3
    waspinator/AccelStepper@^1.64
